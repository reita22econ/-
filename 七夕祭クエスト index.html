<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>異世界冒険クイズ - クエストオブナレッジ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .title {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .game-area {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .character-panel {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .character-info h3 {
            margin-bottom: 15px;
            font-size: 1.3em;
            color: #ffd700;
        }
        
        .stat-bar {
            margin-bottom: 10px;
        }
        
        .stat-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            transition: width 0.3s ease;
        }
        
        .hp-bar { background: #ff4757; }
        .exp-bar { background: #3742fa; }
        
        .battle-area {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .monster-info {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .monster-sprite {
            font-size: 4em;
            margin-bottom: 10px;
        }
        
        .question-area {
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .question {
            font-size: 1.1em;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        .options {
            display: grid;
            gap: 10px;
        }
        
        .option {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 15px;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
        }
        
        .option:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .option.correct {
            background: #2ed573;
        }
        
        .option.incorrect {
            background: #ff4757;
        }
        
        .controls {
            text-align: center;
        }
        
        .btn {
            background: linear-gradient(45deg, #ffa726, #ff7043);
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
            font-size: 1em;
            margin: 5px;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        
        .results {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .hidden {
            display: none;
        }
        
        .battle-log {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
            max-height: 100px;
            overflow-y: auto;
            font-size: 0.9em;
        }
        
        .admin-panel {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }
        
        .admin-toggle {
            background: #ff6b6b;
            margin-bottom: 15px;
        }
        
        .question-editor {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .editor-input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: none;
            border-radius: 5px;
            background: rgba(255,255,255,0.9);
            color: #333;
        }
        
        .treasure-animation {
            animation: sparkle 1s ease-in-out;
        }
        
        @keyframes sparkle {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        @media (max-width: 768px) {
            .game-area {
                grid-template-columns: 1fr;
            }
            
            .title {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">🏰 七夕祭クエスト ⚔️</h1>
            <p>試作、体験版です。よりよくしたいので改善案を募集しています</p>
        </div>
        
        <div class="game-area">
            <div class="character-panel">
                <div class="character-info">
                    <h3>🛡️ 勇者ステータス</h3>
                    <div class="stat-bar">
                        <div class="stat-label">
                            <span>HP</span>
                            <span id="hp-text">100/100</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill hp-bar" id="hp-bar" style="width: 100%"></div>
                        </div>
                    </div>
                    <div class="stat-bar">
                        <div class="stat-label">
                            <span>EXP</span>
                            <span id="exp-text">0/100</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill exp-bar" id="exp-bar" style="width: 0%"></div>
                        </div>
                    </div>
                    <div style="margin-top: 15px;">
                        <p>レベル: <span id="level">1</span></p>
                        <p>スコア: <span id="score">0</span></p>
                        <p>討伐数: <span id="defeated">0</span></p>
                        <p>所持金: <span id="gold">0</span>G</p>
                    </div>
                </div>
                <div class="battle-log" id="battle-log">
                    <p>🌟 異世界への冒険が始まった！</p>
                </div>
            </div>
            
            <div class="battle-area">
                <div class="monster-info">
                    <div class="monster-sprite" id="monster-sprite">👹</div>
                    <h3 id="monster-name">ゴブリン</h3>
                    <p>HP: <span id="monster-hp">30</span></p>
                </div>
                
                <div class="question-area">
                    <div class="question" id="question">クイズモンスターが現れた！知識で倒そう！</div>
                    <div class="options" id="options">
                        <!-- オプションがここに動的に生成される -->
                    </div>
                </div>
                
                <div class="controls">
                    <button class="btn" id="start-btn" onclick="startBattle()">冒険開始！</button>
                    <button class="btn" id="next-btn" onclick="nextQuestion()" style="display: none;">次の敵へ</button>
                </div>
            </div>
        </div>
        
        <div class="results hidden" id="results">
            <h2>🏆 冒険終了！</h2>
            <div id="final-results"></div>
            <button class="btn" onclick="restartGame()">もう一度冒険する</button>
        </div>
        
        <div class="admin-panel">
            <button class="btn admin-toggle" onclick="toggleAdmin()">問題編集モード</button>
            <div id="admin-section" class="hidden">
                <h3>📝 問題管理</h3>
                <p>現在の問題数: <span id="question-count">15</span>問</p>
                <div class="question-editor">
                    <input type="text" class="editor-input" id="new-question" placeholder="問題文を入力">
                    <input type="text" class="editor-input" id="option1" placeholder="選択肢1（正解）">
                    <input type="text" class="editor-input" id="option2" placeholder="選択肢2">
                    <input type="text" class="editor-input" id="option3" placeholder="選択肢3">
                    <input type="text" class="editor-input" id="option4" placeholder="選択肢4">
                    <button class="btn" onclick="addQuestion()">問題を追加</button>
                </div>
                <div id="question-list"></div>
            </div>
        </div>
    </div>

    <script>
        // ゲーム状態管理
        let gameState = {
            hp: 100,
            maxHp: 100,
            level: 1,
            exp: 0,
            maxExp: 100,
            score: 0,
            gold: 0,
            defeated: 0,
            currentQuestionIndex: 0,
            currentMonster: 0,
            gameStarted: false,
            questionAnswered: false
        };

        // モンスターデータ
        const monsters = [
            { name: 'ゴブリン', sprite: '👹', hp: 30, reward: { exp: 20, gold: 10, score: 100 } },
            { name: 'オーク', sprite: '👺', hp: 50, reward: { exp: 30, gold: 20, score: 150 } },
            { name: 'トロール', sprite: '🧌', hp: 70, reward: { exp: 40, gold: 30, score: 200 } },
            { name: 'ドラゴン', sprite: '🐉', hp: 100, reward: { exp: 60, gold: 50, score: 300 } },
            { name: '魔王', sprite: '😈', hp: 150, reward: { exp: 100, gold: 100, score: 500 } }
        ];

        // 問題データ（大学生レベル）
        let questions = [
            {
                question: "シュレーディンガーの猫の思考実験で説明される物理学の概念は？",
                options: ["量子重ね合わせ", "相対性理論", "熱力学第二法則", "波動方程式"],
                correct: 0
            },
            {
                question: "1929年の世界恐慌の発端となった出来事は？",
                options: ["ウォール街大暴落", "第一次世界大戦", "関東大震災", "ロシア革命"],
                correct: 0
            },
            {
                question: "DNAの二重らせん構造を発見したのは誰？",
                options: ["ワトソンとクリック", "メンデル", "ダーウィン", "パスツール"],
                correct: 0
            },
            {
                question: "カフカの代表作「変身」で主人公が変身したものは？",
                options: ["虫", "犬", "鳥", "猫"],
                correct: 0
            },
            {
                question: "マクロ経済学で「流動性の罠」を提唱した経済学者は？",
                options: ["ケインズ", "アダム・スミス", "マルクス", "フリードマン"],
                correct: 0
            },
            {
                question: "プラトンの「洞窟の比喩」が説明しているのは？",
                options: ["イデア論", "三権分立", "社会契約", "功利主義"],
                correct: 0
            },
            {
                question: "微分積分学の基本定理を確立した数学者は？",
                options: ["ニュートンとライプニッツ", "ガウス", "オイラー", "デカルト"],
                correct: 0
            },
            {
                question: "印象派の画家モネの代表作「睡蓮」が描かれた場所は？",
                options: ["ジヴェルニーの自宅庭園", "ルーヴル美術館", "ヴェルサイユ宮殿", "セーヌ河畔"],
                correct: 0
            },
            {
                question: "統計学で「中心極限定理」が成り立つための条件は？",
                options: ["標本サイズが十分大きい", "母集団が正規分布", "標本が独立", "分散が等しい"],
                correct: 0
            },
            {
                question: "社会学者デュルケムが分析した「アノミー」とは何の状態？",
                options: ["社会規範の混乱", "経済格差", "政治対立", "文化衝突"],
                correct: 0
            },
            {
                question: "量子力学の不確定性原理を提唱したのは？",
                options: ["ハイゼンベルク", "シュレーディンガー", "ボーア", "プランク"],
                correct: 0
            },
            {
                question: "ニーチェの「超人思想」が述べられている代表作は？",
                options: ["ツァラトゥストラはこう語った", "善悪の彼岸", "道徳の系譜", "反時代的考察"],
                correct: 0
            },
            {
                question: "ゲーム理論の「ナッシュ均衡」を発見した数学者は？",
                options: ["ジョン・ナッシュ", "フォン・ノイマン", "モルゲンシュテルン", "パレート"],
                correct: 0
            },
            {
                question: "細胞分裂の減数分裂で染色体数が半分になるのはなぜ？",
                options: ["配偶子形成のため", "成長のため", "修復のため", "エネルギー節約のため"],
                correct: 0
            },
            {
                question: "フーコーの振り子実験で証明されたのは？",
                options: ["地球の自転", "地球の公転", "重力の存在", "慣性の法則"],
                correct: 0
            }
        ];

        function updateUI() {
            document.getElementById('hp-text').textContent = `${gameState.hp}/${gameState.maxHp}`;
            document.getElementById('hp-bar').style.width = `${(gameState.hp / gameState.maxHp) * 100}%`;
            document.getElementById('exp-text').textContent = `${gameState.exp}/${gameState.maxExp}`;
            document.getElementById('exp-bar').style.width = `${(gameState.exp / gameState.maxExp) * 100}%`;
            document.getElementById('level').textContent = gameState.level;
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('defeated').textContent = gameState.defeated;
            document.getElementById('gold').textContent = gameState.gold;
            document.getElementById('question-count').textContent = questions.length;
        }

        function addToLog(message) {
            const log = document.getElementById('battle-log');
            log.innerHTML += `<p>${message}</p>`;
            log.scrollTop = log.scrollHeight;
        }

        function displayMonster() {
            const monster = monsters[Math.min(gameState.currentMonster, monsters.length - 1)];
            document.getElementById('monster-sprite').textContent = monster.sprite;
            document.getElementById('monster-name').textContent = monster.name;
            document.getElementById('monster-hp').textContent = monster.hp;
        }

        function displayQuestion() {
            if (gameState.currentQuestionIndex >= questions.length) {
                endGame();
                return;
            }

            const question = questions[gameState.currentQuestionIndex];
            document.getElementById('question').textContent = question.question;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            // 選択肢を完全にランダム化
            const correctAnswer = question.options[question.correct];
            const shuffledOptions = [...question.options].sort(() => Math.random() - 0.5);
            const newCorrectIndex = shuffledOptions.indexOf(correctAnswer);
            
            // シャッフルした選択肢で表示
            shuffledOptions.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option';
                button.textContent = option;
                button.onclick = () => answerQuestion(index, newCorrectIndex);
                optionsContainer.appendChild(button);
            });
        }

        function answerQuestion(selectedIndex, correctIndex) {
            if (gameState.questionAnswered) return;
            
            gameState.questionAnswered = true;
            const question = questions[gameState.currentQuestionIndex];
            const options = document.querySelectorAll('.option');
            
            options.forEach((option, index) => {
                if (index === correctIndex) {
                    option.classList.add('correct');
                } else if (index === selectedIndex && index !== correctIndex) {
                    option.classList.add('incorrect');
                }
                option.disabled = true;
            });

            if (selectedIndex === correctIndex) {
                // 正解時の処理
                const monster = monsters[Math.min(gameState.currentMonster, monsters.length - 1)];
                gameState.score += monster.reward.score;
                gameState.exp += monster.reward.exp;
                gameState.gold += monster.reward.gold;
                gameState.defeated++;
                
                addToLog(`⚡ ${monster.name}に${monster.reward.score}ダメージ！`);
                addToLog(`💰 ${monster.reward.gold}ゴールド、⭐ ${monster.reward.exp}EXPを獲得！`);
                
                // レベルアップチェック
                if (gameState.exp >= gameState.maxExp) {
                    levelUp();
                }
                
                // 次のモンスターへ
                gameState.currentMonster++;
            } else {
                // 不正解時の処理
                gameState.hp -= 20;
                addToLog(`💔 間違えた！20ダメージを受けた...`);
                addToLog(`📚 正解は「${question.options[question.correct]}」でした`);
                
                if (gameState.hp <= 0) {
                    addToLog(`💀 力尽きてしまった...`);
                    endGame();
                    return;
                }
            }
            
            // 正解・不正解に関わらず次のボタンを表示
            document.getElementById('next-btn').style.display = 'inline-block';
            
            updateUI();
        }

        function levelUp() {
            gameState.level++;
            gameState.exp = 0;
            gameState.maxExp += 50;
            gameState.maxHp += 20;
            gameState.hp = gameState.maxHp; // フルヒール
            addToLog(`🎉 レベルアップ！レベル${gameState.level}になった！HPが全回復した！`);
            
            // レベルアップエフェクト
            document.querySelector('.character-panel').classList.add('treasure-animation');
            setTimeout(() => {
                document.querySelector('.character-panel').classList.remove('treasure-animation');
            }, 1000);
        }

        function nextQuestion() {
            gameState.currentQuestionIndex++;
            gameState.questionAnswered = false;
            document.getElementById('next-btn').style.display = 'none';
            displayMonster();
            displayQuestion();
        }

        function startBattle() {
            gameState.gameStarted = true;
            document.getElementById('start-btn').style.display = 'none';
            addToLog(`⚔️ 冒険が始まった！`);
            displayMonster();
            displayQuestion();
        }

        function endGame() {
            document.querySelector('.game-area').style.display = 'none';
            document.getElementById('results').classList.remove('hidden');
            
            let rank = '';
            if (gameState.score >= 1500) rank = '🏆 伝説の勇者';
            else if (gameState.score >= 1000) rank = '⭐ 勇敢な戦士';
            else if (gameState.score >= 500) rank = '🛡️ 駆け出し冒険者';
            else rank = '🌱 見習い勇者';
            
            document.getElementById('final-results').innerHTML = `
                <h3>${rank}</h3>
                <p>最終レベル: ${gameState.level}</p>
                <p>総スコア: ${gameState.score}</p>
                <p>討伐したモンスター: ${gameState.defeated}体</p>
                <p>獲得ゴールド: ${gameState.gold}G</p>
                <p>クリアした問題: ${gameState.currentQuestionIndex}/${questions.length}問</p>
            `;
        }

        function restartGame() {
            gameState = {
                hp: 100,
                maxHp: 100,
                level: 1,
                exp: 0,
                maxExp: 100,
                score: 0,
                gold: 0,
                defeated: 0,
                currentQuestionIndex: 0,
                currentMonster: 0,
                gameStarted: false,
                questionAnswered: false
            };
            
            document.querySelector('.game-area').style.display = 'grid';
            document.getElementById('results').classList.add('hidden');
            document.getElementById('start-btn').style.display = 'inline-block';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('battle-log').innerHTML = '<p>🌟 新たな冒険が始まった！</p>';
            
            updateUI();
        }

        // 管理者機能
        function toggleAdmin() {
            const adminSection = document.getElementById('admin-section');
            adminSection.classList.toggle('hidden');
            updateQuestionList();
        }

        function addQuestion() {
            const questionText = document.getElementById('new-question').value;
            const option1 = document.getElementById('option1').value;
            const option2 = document.getElementById('option2').value;
            const option3 = document.getElementById('option3').value;
            const option4 = document.getElementById('option4').value;
            
            if (questionText && option1 && option2 && option3 && option4) {
                // 新しい問題では正解をランダムに設定
                const options = [option1, option2, option3, option4];
                const randomCorrectIndex = Math.floor(Math.random() * 4);
                
                // 正解を先頭に持ってきて、他をランダムに配置
                const shuffledOptions = [...options];
                const correctAnswer = shuffledOptions[randomCorrectIndex];
                shuffledOptions.splice(randomCorrectIndex, 1);
                shuffledOptions.sort(() => Math.random() - 0.5);
                shuffledOptions.unshift(correctAnswer);
                
                questions.push({
                    question: questionText,
                    options: shuffledOptions,
                    correct: 0 // 常に最初が正解になるよう調整済み
                });
                
                // 入力フィールドをクリア
                document.getElementById('new-question').value = '';
                document.getElementById('option1').value = '';
                document.getElementById('option2').value = '';
                document.getElementById('option3').value = '';
                document.getElementById('option4').value = '';
                
                updateUI();
                updateQuestionList();
                alert('問題を追加しました！');
            } else {
                alert('すべての項目を入力してください。');
            }
        }

        function updateQuestionList() {
            const listContainer = document.getElementById('question-list');
            listContainer.innerHTML = '<h4>📋 現在の問題一覧</h4>';
            
            questions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.innerHTML = `
                    <p><strong>Q${index + 1}:</strong> ${q.question}</p>
                    <p><small>正解: ${q.options[q.correct]}</small></p>
                    <button class="btn" style="background: #ff4757; padding: 5px 10px; font-size: 0.8em;" onclick="removeQuestion(${index})">削除</button>
                    <hr style="margin: 10px 0; opacity: 0.3;">
                `;
                listContainer.appendChild(questionDiv);
            });
        }

        function removeQuestion(index) {
            if (confirm('この問題を削除しますか？')) {
                questions.splice(index, 1);
                updateUI();
                updateQuestionList();
            }
        }

        // 問題をゲーム開始時にランダム化する関数
        function randomizeQuestions() {
            questions = questions.map(q => {
                const correctAnswer = q.options[q.correct];
                const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
                const newCorrectIndex = shuffledOptions.indexOf(correctAnswer);
                
                return {
                    ...q,
                    options: shuffledOptions,
                    correct: newCorrectIndex
                };
            });
        }

        // 初期化
        updateUI();
        displayMonster();
        
        // ゲーム開始時に問題をランダム化
